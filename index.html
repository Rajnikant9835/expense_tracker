<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>Expense Tracker</h1>
        <p class="sub">Track where your money goes.</p>
      </div>
      <div class="total">
        <span class="total-label">Total spent</span>
        <span class="total-value" id="total">₹0.00</span>
      </div>
    </header>

    <div class="grid">
      <section class="panel">
        <h2>Add expense</h2>
        <form id="expense-form">
          <label>Date
            <input type="date" id="date" required>
          </label>
          <label>Category
            <select id="category" required>
              <option>Food</option>
              <option>Travel</option>
              <option>Shopping</option>
              <option>Bills</option>
              <option>Health</option>
              <option>Other</option>
            </select>
          </label>
          <label>Description
            <input type="text" id="description" placeholder="e.g. Lunch with team" required>
          </label>
          <label>Amount (₹)
            <input type="number" id="amount" min="0.01" step="0.01" placeholder="0.00" required>
          </label>
          <button type="submit">Add expense</button>
        </form>

        <h2 class="mt">By category</h2>
        <div id="categories" class="cats"></div>
      </section>

      <section class="panel">
        <h2>All expenses</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Date</th><th>Category</th><th>Description</th><th class="num">Amount</th><th></th></tr>
            </thead>
            <tbody id="list"></tbody>
          </table>
        </div>
        <p id="empty" class="empty">No expenses yet. Add your first one using the form.</p>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
